name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      id-token: write # trusted publishing to rubygems.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.3.5
          bundler-cache: true

      - name: Release gem
        uses: rubygems/release-gem@v1
